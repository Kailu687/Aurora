name: Publish website and updates

# Every push to main rebuilds the website and publishes it to GitHub Pages.
# The installed apps (Android / Windows / web) read update-manifest.json from that site to offer over-the-air updates.
# It also runs when a GitHub Release is published or edited, so the Downloads page snapshot stays current.
on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the website folder
        run: node tools/publish-web.js --out site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
